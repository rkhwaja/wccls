name: Audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

permissions:
  contents: read
  security-events: write # required for the SARIF upload

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nyudenkov/pysentry@v0.5.0
        with:
          args: --direct-only
